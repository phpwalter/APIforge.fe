name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run typecheck:tests
      - run: npm test
      - name: Install pinned coverage provider
        run: npm install --no-save --ignore-scripts @vitest/coverage-v8@1.6.0
      - run: npm run test:coverage
      - run: npm run build
      - run: npm audit --audit-level=high
