          required: true
          schema:
            type: string
            example: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
        - name: Referer
          in: header
          required: true
          schema:
            type: string
            example: http://localhost:5175/
        - name: Accept-Encoding
          in: header
          required: true
          schema:
            type: string
            example: gzip, deflate, br, zstd
        - name: Accept-Language
          in: header
          required: true
          schema:
            type: string
            example: en-US,en;q=0.9
        - name: Cookie
          in: header
          required: true
          schema:
            type: string
            example: Phpstorm-1edb35b3=0606e2ee-ce15-44c4-b00b-b75cfde92094; Webstorm-14ab9a57=0d862a58-f939-4d35-9778-0f472d5c71a5; Webstorm-14ab9e16=df044e30-3fce-4845-be8f-a6591e49af1c
        - name: X-API-Version
          in: header
          required: true
          schema:
            type: string
            example: v1
