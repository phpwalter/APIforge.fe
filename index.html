<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>APIforge</title>
    <!--
      Inline, not in tokens.css: this needs to apply at the very first paint of the raw HTML
      document, before any JS has run. In dev, Vite injects app CSS via JS rather than a <link>
      tag, so there's a real gap on every full-page load (including landing back from an OAuth
      redirect) where the browser would otherwise show its default white background first.
      Matches tokens.css's `body { background: #15151a }` (dark, the app's default theme).
    -->
    <style>
      html,
      body {
        background: #15151a;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
